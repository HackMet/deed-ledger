name: Deploy demo

# Every merge to main deploys the demo Worker (docs/deploy.md "Automatic deploys"). The tests run again first, so a
# red main never ships. Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token limited to this account) and
# CLOUDFLARE_ACCOUNT_ID. Secrets of the Worker itself (WhatsApp, MODEL_API_KEY…) stay in Cloudflare, never here.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer merge waits for the running one instead of cancelling it mid-migration.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated Worker types match wrangler.jsonc
        run: npx wrangler types --check
      - run: npm run typecheck
      - run: npm test
      # Migrations only add, so the code still running keeps working while they apply.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy
        run: >-
          npx wrangler deploy
          --var PRETEND_ENGINE:1
          --var PUBLIC_BASE_URL:https://store-assistant.atiendeme.workers.dev
          --var CONVERSATION:planner
          --var CONSOLE_LANG:en
          --var TEST_COMMANDS:1
          --var MODEL_DAILY_CAP_USD:15
